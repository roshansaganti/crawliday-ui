name: "release"

on:
  push:
    branches:
      - "master"
  # pull_request:
  #   branches:
  #     - "master"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  build:
    name: "Build"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

  release:
    name: "Release"
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Determine next GitHub release version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest_tag=$(gh release list --limit 1 --json tagName --jq '.[0].tagName // empty')
          latest_version=${latest_tag#crawliday-ui-v}
          latest_version=${latest_version#v}

          if [[ ! "$latest_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            latest_version="0.0.0"
          fi

          IFS=. read -r major minor patch <<< "$latest_version"

          pull_request_number=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            --jq '.[0].number // empty')
          labels=""
          if [[ -n "$pull_request_number" ]]; then
            labels=$(gh pr view "$pull_request_number" --json labels --jq '[.labels[].name] | join(",")' | tr '[:upper:]' '[:lower:]')
          fi

          bump_type="patch"
          if [[ ",$labels," == *,major,* ]]; then
            bump_type="major"
          elif [[ ",$labels," == *,enhancement,* ]]; then
            bump_type="minor"
          elif [[ ",$labels," == *,bug,* ]]; then
            bump_type="patch"
          else
            commit_message=$(git log -1 --pretty=%B | tr '[:upper:]' '[:lower:]')
            if [[ "$commit_message" =~ (^|[^[:alnum:]])major([^[:alnum:]]|$) ]]; then
              bump_type="major"
            elif [[ "$commit_message" =~ (^|[^[:alnum:]])(minor|feat|feature)([^[:alnum:]]|$) ]]; then
              bump_type="minor"
            elif [[ "$commit_message" =~ (^|[^[:alnum:]])(patch|bug|fix)([^[:alnum:]]|$) ]]; then
              bump_type="patch"
            fi
          fi

          case "$bump_type" in
            major) next_version="$((major + 1)).0.0" ;;
            minor) next_version="$major.$((minor + 1)).0" ;;
            patch) next_version="$major.$minor.$((patch + 1))" ;;
          esac

          echo "Next GitHub release: $latest_version -> $next_version ($bump_type; labels: ${labels:-none})"

          echo "version=$next_version" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "crawliday-ui-v${VERSION}" \
            --target "$(git rev-parse HEAD)" \
            --title "crawliday-ui-v${VERSION}" \
            --generate-notes

